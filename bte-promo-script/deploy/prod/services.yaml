# Internal services — Pod 2 (polecat) reaches Pod 1 via these DNS names.
apiVersion: v1
kind: Service
metadata:
  name: promo-api
  namespace: bte-gastown
  labels:
    app.kubernetes.io/name: bte-gastown
    app.kubernetes.io/component: promo-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: infra-monolith
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: madeye-proxy
  namespace: bte-gastown
  labels:
    app.kubernetes.io/name: bte-gastown
    app.kubernetes.io/component: madeye-proxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: infra-monolith
  ports:
    - name: http
      port: 4000
      targetPort: 4000

# Pulls bte-gastown/prod/bte-gastown from AWS Secrets Manager.
# S3_BUCKET_NAME included for future use — upload handler still stubbed in promo-api.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bte-gastown-external-secret
  namespace: bte-gastown
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bte-gastown-secret-store
    kind: SecretStore
  target:
    name: bte-gastown-external-secret
    creationPolicy: Owner
  data:
    - secretKey: MADEYE_API_KEY
      remoteRef:
        key: bte-gastown/prod/bte-gastown
        property: MADEYE_API_KEY
    - secretKey: MADEYE_BASE_URL
      remoteRef:
        key: bte-gastown/prod/bte-gastown
        property: MADEYE_BASE_URL
    - secretKey: GENAXIS_API_KEY
      remoteRef:
        key: bte-gastown/prod/bte-gastown
        property: GENAXIS_API_KEY
    - secretKey: PROXY_MASTER_KEY
      remoteRef:
        key: bte-gastown/prod/bte-gastown
        property: PROXY_MASTER_KEY
    - secretKey: S3_BUCKET_NAME
      remoteRef:
        key: bte-gastown/prod/bte-gastown
        property: S3_BUCKET_NAME
---
# Polecat → madeye-proxy auth (same PROXY_MASTER_KEY, key name expected by operator).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: madeye-proxy-auth
  namespace: bte-gastown
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bte-gastown-secret-store
    kind: SecretStore
  target:
    name: madeye-proxy-auth
    creationPolicy: Owner
  data:
    - secretKey: master-key
      remoteRef:
        key: bte-gastown/prod/bte-gastown
        property: PROXY_MASTER_KEY
